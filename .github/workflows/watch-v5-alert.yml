
name: Audeum V5 Ticket Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: audeum-v5-ticket-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore V5 state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p state_v5

          ARTIFACT_ID=$(gh api \
            "repos/$GH_REPO/actions/artifacts?name=audeum-state-v5&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Previous V5 state found: $ARTIFACT_ID"

            gh api \
              "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" \
              > previous-v5-state.zip

            unzip -o previous-v5-state.zip -d state_v5/

            test -f state_v5/audeum_state_v5.json
            echo "Previous V5 state restored"
          else
            echo "No V5 state; creating baseline"
          fi

      - name: Check reservations and send alerts
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: python monitor_v5.py

      - name: Save inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audeum-inspection-v5
          path: inspection_v5/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save V5 state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audeum-state-v5
          path: state_v5/audeum_state_v5.json
          retention-days: 90
          if-no-files-found: error
