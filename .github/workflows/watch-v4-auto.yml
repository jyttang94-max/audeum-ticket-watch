
name: Audeum V4 Auto Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: audeum-ticket-watch-v4
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore previous inspection state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p state

          ARTIFACT_ID=$(gh api \
            "repos/$GH_REPO/actions/artifacts?name=audeum-state-v4&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Previous state found: $ARTIFACT_ID"

            gh api \
              "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" \
              > previous-state.zip

            unzip -o previous-state.zip -d state/

            if [ -f state/audeum_state_v4.json ]; then
              echo "Previous state restored"
            else
              echo "State file missing from artifact"
              exit 1
            fi
          else
            echo "No previous state; creating baseline"
          fi

      - name: Observe Audeum reservations
        run: python monitor_v4_observe.py

      - name: Save inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audeum-inspection-v4
          path: inspection_v4/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save current state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audeum-state-v4
          path: state/audeum_state_v4.json
          retention-days: 90
          if-no-files-found: error
