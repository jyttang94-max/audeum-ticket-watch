
name: Audeum ticket watch V2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Inspect Audeum booking
        run: python monitor_v2.py

      - name: Save inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audeum-inspection-v2
          path: inspection/
          retention-days: 3
          if-no-files-found: warn
